[package]
name = "atomic-matrix"
version = "0.4.1"
edition = "2024"
authors = ['Dottsss']
description = "A lock-free, high end allocator primitive for high-performance IPC."
license = "Apache-2.0"
repository = "https://github.com/CodenamePhantom/AtomicMatrix"
keywords = ["allocator", "lock-free", "ipc", "shared-memory", "tlsf"]
categories = ["memory-management", "concurrency", "os"]
readme = "README.md"

[features]
default = []

[dependencies]
atomic-matrix-derive = { git = "https://github.com/CodenamePhantom/AtomicMatrix-Derive"}
better_result = "0.3"
memmap2 = "0.9.10"
libc = "0.2.186"
